<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-lcsc3d-svg'; style-src 'unsafe-inline'; img-src data:;">
<style>
html, body { margin:0; width:100%; height:100%; overflow:hidden; }
#canvas { width:100%; height:100%; overflow:hidden; cursor:grab; touch-action:none; user-select:none; }
#canvas.dragging { cursor:grabbing; }
#canvas > svg { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<div id="canvas" aria-label="商城官方器件预览"></div>
<script nonce="lcsc3d-svg">
(() => {
  const canvas = document.getElementById('canvas');
  let svg = null, content = null, fitted = null, box = null, zoom = 1, autoFit = true, drag = null, token = 0;
  function signal(status, message, revision = token, diagnostic = '') {
    console.log('LCSC3D_SVG_STATE:' + JSON.stringify({token: revision, status, message, diagnostic}));
  }
  function fittedBox() {
    const rect = canvas.getBoundingClientRect();
    const aspect = Math.max(rect.width, 1) / Math.max(rect.height, 1);
    let width = content.width * 1.12, height = content.height * 1.12;
    if (width / height < aspect) width = height * aspect; else height = width / aspect;
    return {x: content.x + (content.width - width) / 2, y: content.y + (content.height - height) / 2, width, height};
  }
  function draw() {
    svg.setAttribute('viewBox', `${box.x} ${box.y} ${box.width} ${box.height}`);
  }
  window.fitSvg = () => {
    if (!svg || !content) return;
    fitted = fittedBox(); box = {...fitted}; zoom = 1; autoFit = true; draw();
  };
  function addPadNumbers() {
    const ns = 'http://www.w3.org/2000/svg';
    const labels = document.createElementNS(ns, 'g');
    labels.setAttribute('data-pad-numbers', 'true');
    labels.setAttribute('pointer-events', 'none');
    for (const pad of svg.querySelectorAll('g[c_partid="part_pad"][number]')) {
      const origin = (pad.getAttribute('c_origin') || '').split(',').map(Number);
      const number = pad.getAttribute('number');
      if (origin.length !== 2 || !origin.every(Number.isFinite) || !number || pad.querySelector('text')) continue;
      const point = new DOMPoint(...origin).matrixTransform(pad.getCTM()).matrixTransform(svg.getCTM().inverse());
      const size = Math.min(Math.abs(Number(pad.getAttribute('c_width'))), Math.abs(Number(pad.getAttribute('c_height'))));
      const fontSize = size > 0 ? Math.min(1, size * 0.9 / Math.max(1, number.length * 0.65)) : 1;
      const text = document.createElementNS(ns, 'text');
      text.textContent = number;
      for (const [key, value] of Object.entries({x:point.x, y:point.y, 'text-anchor':'middle',
        'dominant-baseline':'central', 'font-family':'Consolas,monospace', 'font-size':fontSize,
        fill:'#ffffff', stroke:'#000000', 'stroke-width':0.02, 'paint-order':'stroke fill'})) {
        text.setAttribute(key, value);
      }
      labels.appendChild(text);
    }
    if (labels.childElementCount) svg.appendChild(labels);
  }
  function extendSymbolPins(preset) {
    for (const pin of svg.querySelectorAll('g[c_partid="part_pin"]')) {
      // Official pin artwork starts with its straight shaft, from the
      // connection hotspot toward the body. Edge symbols remain at the body.
      const shaft = [...pin.children].find(node => node.localName === 'path');
      if (!shaft) continue;
      const total = shaft.getTotalLength();
      const start = shaft.getPointAtLength(0), end = shaft.getPointAtLength(total);
      const straight = Math.hypot(start.x - end.x, start.y - end.y);
      if (!straight || Math.abs(total - straight) > 0.001) continue;
      const rootMatrix = svg.getCTM(), shaftMatrix = shaft.getCTM();
      if (!rootMatrix || !shaftMatrix) continue;
      const toRoot = rootMatrix.inverse().multiply(shaftMatrix);
      const outer = new DOMPoint(start.x, start.y).matrixTransform(toRoot);
      const body = new DOMPoint(end.x, end.y).matrixTransform(toRoot);
      const length = Math.hypot(outer.x - body.x, outer.y - body.y);
      if (!length || length >= preset.minPinLength - 0.0001) continue;
      const factor = preset.minPinLength / length - 1;
      const dx = (outer.x - body.x) * factor, dy = (outer.y - body.y) * factor;
      const extended = new DOMPoint(outer.x + dx, outer.y + dy);
      const local = extended.matrixTransform(toRoot.inverse());
      shaft.setAttribute('d', `M ${local.x} ${local.y} L ${end.x} ${end.y}`);
      const dot = pin.querySelector('circle[c_pindot]');
      if (dot && dot.getCTM()) {
        const point = extended.matrixTransform(dot.getCTM().inverse().multiply(svg.getCTM()));
        dot.setAttribute('cx', point.x); dot.setAttribute('cy', point.y);
      }
      if (pin.getCTM()) {
        const origin = extended.matrixTransform(pin.getCTM().inverse().multiply(svg.getCTM()));
        pin.setAttribute('c_origin', `${origin.x},${origin.y}`);
      }
      // Keep names at the body and move the number with the shaft's midpoint.
      const designator = pin.querySelectorAll('text')[1];
      if (designator && designator.parentElement.getCTM()) {
        const parentToRoot = svg.getCTM().inverse().multiply(designator.parentElement.getCTM());
        const inverse = parentToRoot.inverse();
        const zero = new DOMPoint(0, 0).matrixTransform(inverse);
        const offset = new DOMPoint(dx / 2, dy / 2).matrixTransform(inverse);
        const original = designator.getAttribute('transform') || '';
        designator.setAttribute('transform', `translate(${offset.x - zero.x},${offset.y - zero.y}) ${original}`);
      }
    }
  }
  function applySymbolStyle(preset) {
    if (!preset) return;
    extendSymbolPins(preset);
    const elements = [...svg.querySelectorAll('rect,circle,ellipse,polyline,line,polygon,path,text,tspan')];
    // Read computed values before changing any ancestor. This respects the
    // official SVG's inline/inherited styles, CSS classes and hidden pins.
    const items = elements.map(node => {
      const style = getComputedStyle(node);
      return {node, fill:style.fill, stroke:style.stroke};
    });
    const bounds = svg.viewBox.baseVal;
    const rectangles = [];
    let canvasBackground = null;
    const light = fill => {
      const rgb = fill.match(/^rgba?\(\s*([\d.]+)[, ]+([\d.]+)[, ]+([\d.]+)/i);
      return rgb && rgb.slice(1, 4).map(Number).reduce((a, b) => a + b, 0) / 3 >= preset.lightFillThreshold;
    };
    for (const {node, fill, stroke} of items) {
      // Compare native SVG lengths to the native viewBox: both use the same
      // float precision. Number("26.3") differs from viewBox.baseVal.height.
      if (node.parentElement === svg && node.localName === 'rect' && stroke === 'none'
          && node.x.baseVal.value === bounds.x && node.y.baseVal.value === bounds.y
          && node.width.baseVal.value === bounds.width && node.height.baseVal.value === bounds.height) {
        canvasBackground = node;
        continue;
      }
      if (node.hasAttribute('c_pindot')) continue; // Editor connection hotspots.
      const pin = !!node.closest('[c_partid="part_pin"]');
      const set = (key, value) => node.style.setProperty(key, value, 'important');
      if (node.localName === 'text' || node.localName === 'tspan') {
        set('font-family', preset.font);
        // Keep each source size, including CSS inheritance and tspan sizes.
        set('font-weight', 'normal'); set('font-style', 'normal');
        if (fill !== 'none') set('fill', preset.text);
        if (stroke !== 'none') set('stroke', preset.text);
      } else {
        if (node.localName === 'rect' && preset.squareRectangles) {
          set('rx', '0'); set('ry', '0');
          set('stroke', preset.outline);
          set('stroke-width', preset.rectangleLineWidth || 1);
          if (preset.rectangleLineWidth === 0) set('vector-effect', 'non-scaling-stroke');
          set('stroke-dasharray', 'none');
          set('fill', preset.rectangleFilled ? preset.area : 'none');
          // Transparent is independent of Fill Color: keep a translucent fill
          // so underlying objects remain visible, rather than disabling fill.
          set('fill-opacity', preset.rectangleTransparent ? 0.5 : 1);
          rectangles.push(node);
          continue;
        }
        if (stroke !== 'none') {
          set('stroke', pin ? preset.pin : preset.outline);
          set('stroke-width', preset.lineWidth);
        }
        if (fill !== 'none') {
          // Pale backgrounds stay pale; filled arrows/polarity marks stay ink.
          set('fill', light(fill) ? (pin ? '#ffffff' : preset.area) : (pin ? preset.pin : preset.outline));
        }
      }
    }
    // Match native export: translucent rectangle bodies sit behind content,
    // and the preview canvas itself remains below all component artwork.
    for (const rectangle of rectangles.reverse()) {
      const parent = rectangle.parentNode;
      const first = parent === svg && canvasBackground ? canvasBackground.nextSibling : parent.firstChild;
      parent.insertBefore(rectangle, first);
    }
  }
  window.showSvgDocument = (encoded, background, revision, symbolStyle = null) => {
    token = revision; drag = null; svg = null; content = null; box = null;
    canvas.classList.remove('dragging'); canvas.replaceChildren();
    document.body.style.background = background;
    try {
      const raw = new TextDecoder().decode(Uint8Array.from(atob(encoded), c => c.charCodeAt(0)));
      const parsed = new DOMParser().parseFromString(raw, 'image/svg+xml');
      const root = parsed.documentElement;
      if (parsed.querySelector('parsererror') || root.localName !== 'svg' || root.namespaceURI !== 'http://www.w3.org/2000/svg') {
        throw new Error('文档不是有效的 SVG');
      }
      // Official SVG data is passive artwork; keep remote content passive here.
      root.querySelectorAll('script, foreignObject, iframe, object, embed').forEach(node => node.remove());
      [root, ...root.querySelectorAll('*')].forEach(node => {
        for (const attr of [...node.attributes]) {
          if (/^on/i.test(attr.name) || (/^(href|xlink:href)$/i.test(attr.name) && !attr.value.startsWith('#') && !attr.value.startsWith('data:image/'))) {
            node.removeAttributeNode(attr);
          }
        }
      });
      svg = document.importNode(root, true);
      svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      canvas.appendChild(svg);
      applySymbolStyle(symbolStyle);
      const bounds = svg.viewBox.baseVal;
      const b = bounds.width > 0 && bounds.height > 0 ? bounds : svg.getBBox();
      if (![b.x, b.y, b.width, b.height].every(Number.isFinite) || b.width <= 0 || b.height <= 0) {
        throw new Error('图形范围无效');
      }
      content = {x:b.x, y:b.y, width:b.width, height:b.height};
      if (symbolStyle) {
        // A new font can extend beyond the original SVG's viewport.
        const painted = svg.getBBox();
        const right = Math.max(content.x + content.width, painted.x + painted.width);
        const bottom = Math.max(content.y + content.height, painted.y + painted.height);
        content.x = Math.min(content.x, painted.x); content.y = Math.min(content.y, painted.y);
        content.width = right - content.x; content.height = bottom - content.y;
      }
      // The storefront also overlays numbers from the SVG's pad attributes.
      addPadNumbers();
      window.fitSvg();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (revision === token) signal('ready', '商城官方 SVG 已显示', revision);
      }));
    } catch (error) {
      canvas.replaceChildren(); svg = null; content = null; box = null;
      signal('error', '官方 SVG 无法显示：' + error.message, revision, 'svg_render');
    }
  };
  canvas.addEventListener('wheel', event => {
    if (!svg || !box || event.deltaY === 0) return;
    event.preventDefault(); autoFit = false;
    const rect = canvas.getBoundingClientRect();
    const px = (event.clientX - rect.left) / rect.width, py = (event.clientY - rect.top) / rect.height;
    const next = Math.max(0.2, Math.min(20, zoom * Math.exp(-event.deltaY * 0.002)));
    const factor = zoom / next;
    box = {x:box.x + box.width * px * (1-factor), y:box.y + box.height * py * (1-factor), width:box.width * factor, height:box.height * factor};
    zoom = next; draw();
  }, {passive:false});
  canvas.addEventListener('pointerdown', event => {
    if (!box || event.button !== 0) return;
    autoFit = false; drag = {pointer:event.pointerId, x:event.clientX, y:event.clientY, box:{...box}};
    canvas.setPointerCapture(event.pointerId); canvas.classList.add('dragging'); event.preventDefault();
  });
  canvas.addEventListener('pointermove', event => {
    if (!drag || drag.pointer !== event.pointerId || !box) return;
    const rect = canvas.getBoundingClientRect();
    box = {...drag.box, x:drag.box.x - (event.clientX-drag.x) * drag.box.width/rect.width, y:drag.box.y - (event.clientY-drag.y) * drag.box.height/rect.height};
    draw();
  });
  function endDrag(event) {
    if (drag && drag.pointer === event.pointerId) { drag = null; canvas.classList.remove('dragging'); }
  }
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('lostpointercapture', endDrag);
  canvas.addEventListener('dblclick', window.fitSvg);
  new ResizeObserver(() => {
    if (!box || !content) return;
    if (autoFit) { window.fitSvg(); return; }
    const center = {x:box.x + box.width/2, y:box.y + box.height/2};
    fitted = fittedBox();
    box = {x:center.x - fitted.width/zoom/2, y:center.y - fitted.height/zoom/2, width:fitted.width/zoom, height:fitted.height/zoom};
    draw();
  }).observe(canvas);
  window.getSvgPreviewState = () => ({token, loaded:!!svg, zoom, autoFit, box:box && {...box}});
})();
</script>
</body>
</html>
